name: Deploy Android (Play Store)

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  id-token: write
  contents: read

jobs:
  deploy-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      # Workload Identity Federation — no service-account JSON key/secret needed. Exchanges
      # this job's OIDC token for short-lived Google credentials and exports
      # GOOGLE_APPLICATION_CREDENTIALS for the rest of the job, which Gradle Play Publisher
      # picks up via useApplicationDefaultCredentials (androidApp/build.gradle.kts).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1014783111965/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'play-console-service-account@college-executive-function.iam.gserviceaccount.com'
          # google-github-actions/auth defaults to the broad cloud-platform scope, which the
          # Android Publisher API does not accept — it requires this specific scope regardless
          # of what IAM/Play-Console permissions the service account otherwise has. Without
          # this, every androidpublisher.googleapis.com call gets a 401/403 even though the
          # service account is correctly configured on both the GCP and Play Console sides
          # (verified directly in both consoles — Play Console permissions and API enablement
          # were not the problem).
          token_format: 'access_token'
          access_token_scopes: 'https://www.googleapis.com/auth/androidpublisher'

      # gcloud has no android-publisher/Play command group — the Android Publisher API is
      # scoped per-package with no "list my apps" endpoint. This opens (and immediately
      # discards) a draft edit for our own applicationId as the real access smoke test.
      - name: Verify Play Store API access
        run: |
          set -o pipefail
          ACCESS_TOKEN=$(gcloud auth application-default print-access-token)

          # -sS (not -sf): -f discards the response body on a non-2xx, which is exactly the
          # information needed to diagnose *why* the request failed — a bare "curl -sf | python3"
          # pipe here previously masked every real HTTP error as a generic downstream
          # json.decoder.JSONDecodeError on empty input (v3.0.3's actual failure), with pipefail
          # off meaning even curl's own non-zero exit code was swallowed by the pipe.
          HTTP_CODE=$(curl -sS -o /tmp/open-edit-response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.borinquenterrier.cef/edits")
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Play Console API request failed with HTTP $HTTP_CODE:"
            cat /tmp/open-edit-response.json
            exit 1
          fi
          EDIT_ID=$(python3 -c 'import json; print(json.load(open("/tmp/open-edit-response.json"))["id"])')
          echo "Opened edit $EDIT_ID — service account has Play Console access to com.borinquenterrier.cef."
          curl -sf -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.borinquenterrier.cef/edits/$EDIT_ID:delete"

      - name: Decode release keystore
        env:
          CEF_KEYSTORE_BASE64: ${{ secrets.CEF_KEYSTORE_BASE64 }}
        run: echo "$CEF_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build and publish release bundle to Play Store
        env:
          CEF_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          CEF_KEYSTORE_PASSWORD: ${{ secrets.CEF_KEYSTORE_PASSWORD }}
          CEF_KEYSTORE_ALIAS: ${{ secrets.CEF_KEYSTORE_ALIAS }}
          CEF_KEYSTORE_KEY_PASSWORD: ${{ secrets.CEF_KEYSTORE_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew :androidApp:publishReleaseBundle -Pcef.versionName="$VERSION"
