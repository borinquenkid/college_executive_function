name: PR Check (Build + Contributions)

# Runs on every pull request targeting main, including forks.
# Forks intentionally have no access to repo secrets — AI tests skip gracefully
# via resolveApiKey() returning null, so the build still passes.
on:
  pull_request:
    branches: [main]

jobs:

  validate-contributions:
    name: Validate contributions/ namespace & content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run contributions validator
        run: python3 scripts/validate_contributions.py

  build-and-test:
    name: Build and run JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v5
      - name: Run JVM tests
        # Secrets are unavailable for fork PRs; AI integration tests skip gracefully.
        # GOOGLE_CLIENT_ID / SECRET are needed only to compile OAuth constants — not
        # to run non-live tests — so we fall back to empty strings for fork builds.
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || '' }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET || '' }}
        run: ./gradlew :composeApp:jvmTest

      - name: Run Android unit tests + debug build
        # No emulator/device needed — testDebugUnitTest runs the shared commonTest suite
        # headlessly on the JVM (826 tests, confirmed passing locally). Previously nothing
        # validated the Android target in CI at all, not even a debug compile.
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || '' }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET || '' }}
        run: ./gradlew :composeApp:testDebugUnitTest :androidApp:assembleDebug

      - name: Run server tests
        # Previously nothing ran :server:test in CI at all — the mocked route tests, the
        # tenant-routing/session tests, and the multipart upload-size guard all went
        # unverified before merge. *LiveIntegrationTest (real Gemini calls) stays excluded
        # by default, matching the composeApp AI-test gating below.
        run: ./gradlew :server:test

      - name: Verify Google OAuth Credentials (Integration Test)
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          if [ -n "$GOOGLE_REFRESH_TOKEN" ]; then
            ./gradlew :composeApp:jvmTest -PrunAITests=true --tests "com.borinquenterrier.cef.GoogleOAuthIntegrationTest"
          else
            echo "Skipping integration test: GOOGLE_REFRESH_TOKEN secret is not set."
          fi

  build-web:
    name: Build web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Lint
        # First time lint runs in CI at all — includes eslint-plugin-jsx-a11y as the automated
        # accessibility regression guardrail (see docs/adr/0009-web-accessibility-remediation.md).
        working-directory: web
        run: npm run lint
      - name: Test
        # Vitest + React Testing Library + vitest-axe (ADR 0011 AC-2) — runtime accessibility
        # coverage (dynamic ARIA state, focus behavior, rendered heading structure) beyond what
        # eslint-plugin-jsx-a11y's static JSX-shape linting above can catch.
        working-directory: web
        run: npm test
      - name: Type-check and build
        working-directory: web
        run: npm run build

