name: Release Desktop (JVM)

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Run JVM tests
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: ./gradlew :composeApp:jvmTest

      - name: Run server tests
        # :server:test never ran on the release path before — pr-check.yml's copy of this step
        # only runs on pull requests, so a direct-to-main push (bypassing branch protection) or
        # a tag push skipped it entirely. *LiveIntegrationTest stays excluded by default.
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: ./gradlew :server:test

      - name: Verify Google OAuth Credentials (Integration Test)
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: ./gradlew :composeApp:jvmTest -PrunAITests=true --tests "com.borinquenterrier.cef.GoogleOAuthIntegrationTest"

  verify-web:
    name: Build and test web client
    # Mirrors pr-check.yml's build-web job exactly — that job only runs on pull_request, so a
    # direct-to-main push or a tag push skipped it entirely, the same gap :server:test had above
    # before it was added to this workflow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Test
        working-directory: web
        run: npm test
      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: E2E accessibility tests (Playwright)
        working-directory: web
        run: npm run test:e2e
      - name: Type-check and build
        working-directory: web
        run: npm run build

  build:
    needs: [verify, verify-web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            task: packageReleaseDmg
            ext: dmg
          - os: windows-latest
            task: packageReleaseMsi
            ext: msi
          - os: ubuntu-latest
            task: packageReleaseDeb
            ext: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build ${{ matrix.ext }} installer
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
          CEF_OTLP_ENDPOINT: ${{ secrets.CEF_OTLP_ENDPOINT }}
          CEF_OTLP_USER: ${{ secrets.CEF_OTLP_USER }}
          CEF_OTLP_PASSWORD: ${{ secrets.CEF_OTLP_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew :composeApp:${{ matrix.task }} -Pcef.versionName="$VERSION"
      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.ext }}
          path: composeApp/build/compose/binaries/**/*.${{ matrix.ext }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/**/*.dmg
            dist/**/*.msi
            dist/**/*.deb
