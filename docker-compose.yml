services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: cef-openobserve
    restart: unless-stopped
    environment:
      ZO_ROOT_USER_EMAIL: ${CEF_OTLP_USER:-root@local.dev}
      ZO_ROOT_USER_PASSWORD: ${CEF_OTLP_PASSWORD:-Oficio_dev_2026}
      ZO_DATA_DIR: /data
    ports:
      - "5428:5080"   # host:container — UI: http://localhost:5428, OTLP: http://localhost:5428/api/default/v1/traces
    volumes:
      - openobserve-data:/data

  # Production deployment of the Ktor server + React web client.
  # See docs/adr/0002-multi-tenant-docker-path-partitioned-storage.md for the design.
  #
  # GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET come from the root .env (Compose auto-loads
  # it for ${...} substitution) — the same values the desktop app's OAuth flow uses,
  # needed here only to refresh already-linked Google tokens.
  #
  # Deliberately NOT set here: CEF_GEMINI_API_KEY. Each tenant configures their own
  # Gemini key via POST /api/settings after the stack is up — the server never
  # auto-imports the operator's key into a tenant (see ServerContainerFactory).
  #
  # Backups run automatically (see ScheduledBackupJob) — no host cron needed. Disable by
  # removing CEF_BACKUP_DIR; change frequency with CEF_BACKUP_INTERVAL_HOURS.
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      - CEF_TENANT_BASE_DIR=/data/tenants
      - CEF_BACKUP_DIR=/data/backups
      - CEF_BACKUP_INTERVAL_HOURS=${CEF_BACKUP_INTERVAL_HOURS:-24}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - tenant-data:/data/tenants
      - tenant-backups:/data/backups
    restart: unless-stopped

  web:
    build:
      context: ./web
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  openobserve-data:
  tenant-data:
  tenant-backups:
