#Versioning
# Single source of truth for app/package version. Override per-build with
# -Pcef.versionName=X.Y.Z (e.g. derived from a release git tag in CI).
cef.versionName=3.0.9
# Android's Play-Store-facing build number. Must strictly increase on every uploaded
# artifact (Play rejects a re-upload with a duplicate versionCode) — bumped by release.sh,
# independent of versionName since a re-upload can happen without a semantic version change.
cef.versionCode=37

#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx6144M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.builtInKotlin=false
android.newDsl=false
