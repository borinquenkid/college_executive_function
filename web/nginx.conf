server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any path that isn't a real file falls back to index.html
    location / {
        try_files $uri /index.html;
    }

    # Staff console — a separate bundle (see docs/adr/0007), not a route inside the main SPA.
    # /api/staff/* is already covered by the /api/ block below.
    location /staff/ {
        try_files $uri /staff/index.html;
    }

    # SSE stream: nginx buffers proxied responses by default, which would turn the
    # agent's token-by-token stream into delayed batches. Disable buffering and keep
    # the connection open for as long as the stream runs.
    location /api/agent/stream {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
